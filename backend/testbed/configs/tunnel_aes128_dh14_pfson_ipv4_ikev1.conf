# PLAN.md matrix rows 13-16: IKEv1 vs IKEv2 variant of the same cipher suite
# as tunnel_aes128_dh14_pfson_ipv4.conf, to exercise the IKE-version parsing
# path (app/ike/parser.py has separate IKEv1 Phase 1/2 attribute parsing vs
# IKEv2's typed transforms -- this variant is what should exercise it).
# AES-128-CBC + SHA-256, MODP-2048, PFS on, IKEv1, tunnel mode.
#
# NOTE: this config file has an _ikev1 suffix so it doesn't collide with the
# IKEv2 variant of the same cipher suite on disk -- the *captured pcap*
# filename still follows the standard {mode}_{cipher}_{dh}_{pfs}_{iptype}_
# {traffic}_{timestamp}.pcap convention with no ikeversion segment, since
# IKE version is parsed from the packet itself, not part of the dataset's
# ground-truth label.
config setup
    charondebug="ike 1, knl 1, cfg 0"
    uplogtimes=yes

conn %default
    keyexchange=ikev1
    authby=secret
    auto=start

conn net-net
    left=172.20.0.10
    leftsubnet=10.0.1.0/24
    leftid=172.20.0.10
    right=172.20.0.20
    rightsubnet=10.0.2.0/24
    rightid=172.20.0.20
    type=tunnel
    ike=aes128-sha256-modp2048!
    esp=aes128-sha256-modp2048!
