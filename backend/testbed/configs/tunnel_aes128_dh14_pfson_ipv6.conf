# PLAN.md matrix row 10: common minimum-acceptable baseline over IPv6.
# AES-128-CBC + SHA-256, MODP-2048, PFS on, IKEv2, tunnel mode.
#
# NOTE: see tunnel_aesgcm256_dh19_pfson_ipv6.conf's header comment -- this
# needs an IPv6-enabled docker-compose.yml network to actually run.
config setup
    charondebug="ike 1, knl 1, cfg 0"
    uplogtimes=yes

conn %default
    keyexchange=ikev2
    authby=secret
    auto=start
    dpdaction=restart
    dpddelay=30s

conn net-net
    left=fd00:172:20::10
    leftsubnet=fd00:10:1::/64
    leftid=fd00:172:20::10
    right=fd00:172:20::20
    rightsubnet=fd00:10:2::/64
    rightid=fd00:172:20::20
    type=tunnel
    ike=aes128-sha256-modp2048!
    esp=aes128-sha256-modp2048!
