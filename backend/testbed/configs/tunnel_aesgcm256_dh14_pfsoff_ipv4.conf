# PLAN.md matrix row 5: strong cipher, PFS deliberately off -- isolates the
# PFS penalty from the cipher/DH penalties in the scoring engine.
# AES-256-GCM, MODP-2048, PFS off, IKEv2, tunnel mode.
config setup
    charondebug="ike 1, knl 1, cfg 0"
    uplogtimes=yes

conn %default
    keyexchange=ikev2
    authby=secret
    auto=start
    dpdaction=restart
    dpddelay=30s

conn net-net
    left=172.20.0.10
    leftsubnet=10.0.1.0/24
    leftid=172.20.0.10
    right=172.20.0.20
    rightsubnet=10.0.2.0/24
    rightid=172.20.0.20
    type=tunnel
    ike=aes256gcm16-prfsha256-modp2048!
    esp=aes256gcm16!
    pfs=no
