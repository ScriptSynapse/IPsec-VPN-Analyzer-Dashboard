# Deliberately weak/legacy config for exercising the scoring engine's threat
# matrix: 3DES, SHA-1, MODP-1024, no PFS, IKEv1 main mode, tunnel mode.
config setup
    charondebug="ike 1, knl 1, cfg 0"
    uplogtimes=yes

conn %default
    keyexchange=ikev1
    authby=secret
    auto=start

conn net-net
    left=172.20.0.10
    leftsubnet=10.0.1.0/24
    leftid=172.20.0.10
    right=172.20.0.20
    rightsubnet=10.0.2.0/24
    rightid=172.20.0.20
    type=tunnel
    ike=3des-sha1-modp1024!
    esp=3des-sha1!
    pfs=no
