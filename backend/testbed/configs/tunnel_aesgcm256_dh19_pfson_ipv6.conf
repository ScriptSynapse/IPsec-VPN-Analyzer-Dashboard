# PLAN.md matrix row 9: strong AEAD baseline over IPv6.
# AES-256-GCM, ECP-256, PFS on, IKEv2, tunnel mode.
#
# NOTE: docker-compose.yml as checked in only provisions IPv4 subnets. To
# actually run this variant, add an IPv6-enabled network (enable_ipv6: true
# plus an IPv6 subnet) to docker-compose.yml and update the addresses below
# to match -- the ULA prefixes here are placeholders for that setup. See
# tunnel_aesgcm256_dh20_pfson_ipv6.conf for the ECP-384 sibling of this file.
config setup
    charondebug="ike 1, knl 1, cfg 0"
    uplogtimes=yes

conn %default
    keyexchange=ikev2
    authby=secret
    auto=start
    dpdaction=restart
    dpddelay=30s

conn net-net
    left=fd00:172:20::10
    leftsubnet=fd00:10:1::/64
    leftid=fd00:172:20::10
    right=fd00:172:20::20
    rightsubnet=fd00:10:2::/64
    rightid=fd00:172:20::20
    type=tunnel
    ike=aes256gcm16-prfsha256-ecp256!
    esp=aes256gcm16-ecp256!
