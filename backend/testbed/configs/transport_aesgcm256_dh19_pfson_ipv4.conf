# PLAN.md matrix row 8: transport mode with a modern AEAD cipher.
# AES-256-GCM, ECP-256, PFS on, IKEv2, transport mode (gateway-to-gateway
# only -- no leftsubnet/rightsubnet, see transport_aes128_dh14_pfson_ipv4.conf).
config setup
    charondebug="ike 1, knl 1, cfg 0"
    uplogtimes=yes

conn %default
    keyexchange=ikev2
    authby=secret
    auto=start
    dpdaction=restart
    dpddelay=30s

conn host-host
    left=172.20.0.10
    leftid=172.20.0.10
    right=172.20.0.20
    rightid=172.20.0.20
    type=transport
    ike=aes256gcm16-prfsha256-ecp256!
    esp=aes256gcm16-ecp256!
