# Moderate-strength but PFS-disabled config, to isolate the scoring engine's
# PFS penalty from its cipher/DH penalties: AES-256-CBC, SHA-256, MODP-1536,
# no PFS, IKEv2, tunnel mode.
config setup
    charondebug="ike 1, knl 1, cfg 0"
    uplogtimes=yes

conn %default
    keyexchange=ikev2
    authby=secret
    auto=start
    dpdaction=restart
    dpddelay=30s

conn net-net
    left=172.20.0.10
    leftsubnet=10.0.1.0/24
    leftid=172.20.0.10
    right=172.20.0.20
    rightsubnet=10.0.2.0/24
    rightid=172.20.0.20
    type=tunnel
    ike=aes256-sha256-modp1536!
    esp=aes256-sha256!
    pfs=no
