# PLAN.md matrix rows 13-16: IKEv1 variant of tunnel_aes256_dh14_pfson_ipv4.conf
# -- see that file's IKEv2 version and tunnel_aes128_dh14_pfson_ipv4_ikev1.conf's
# header comment for why this pairing exists (IKE-version parsing coverage).
# AES-256-CBC + SHA-256, MODP-2048, PFS on, IKEv1, tunnel mode.
config setup
    charondebug="ike 1, knl 1, cfg 0"
    uplogtimes=yes

conn %default
    keyexchange=ikev1
    authby=secret
    auto=start

conn net-net
    left=172.20.0.10
    leftsubnet=10.0.1.0/24
    leftid=172.20.0.10
    right=172.20.0.20
    rightsubnet=10.0.2.0/24
    rightid=172.20.0.20
    type=tunnel
    ike=aes256-sha256-modp2048!
    esp=aes256-sha256-modp2048!
