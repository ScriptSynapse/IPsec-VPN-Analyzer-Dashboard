# Transport mode protects traffic directly between the gateway endpoints
# themselves (no leftsubnet/rightsubnet) rather than routing LAN-to-LAN --
# this is the standard use case for transport mode.
config setup
    charondebug="ike 1, knl 1, cfg 0"
    uplogtimes=yes

conn %default
    keyexchange=ikev2
    authby=secret
    auto=start
    dpdaction=restart
    dpddelay=30s

conn host-host
    left=172.20.0.10
    leftid=172.20.0.10
    right=172.20.0.20
    rightid=172.20.0.20
    type=transport
    ike=aes128-sha256-modp2048!
    esp=aes128-sha256-modp2048!
