# PLAN.md matrix row 6: intentionally weak config #1 -- SHA-1 is deprecated
# for new deployments (RFC 8221) and MODP-1024 falls below the 112-bit
# security minimum (NIST SP 800-77 Rev.1). Needed so the scoring engine and
# demo have a genuinely bad config to flag, per PLAN.md section 1.
# AES-128-CBC + SHA-1, MODP-1024, PFS off, IKEv2, tunnel mode.
config setup
    charondebug="ike 1, knl 1, cfg 0"
    uplogtimes=yes

conn %default
    keyexchange=ikev2
    authby=secret
    auto=start

conn net-net
    left=172.20.0.10
    leftsubnet=10.0.1.0/24
    leftid=172.20.0.10
    right=172.20.0.20
    rightsubnet=10.0.2.0/24
    rightid=172.20.0.20
    type=tunnel
    ike=aes128-sha1-modp1024!
    esp=aes128-sha1!
    pfs=no
