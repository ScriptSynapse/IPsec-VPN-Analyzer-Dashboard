# PLAN.md matrix row 11: strongest elliptic-curve group in the matrix.
# AES-256-CBC + SHA-256, ECP-521, PFS on, IKEv2, tunnel mode.
config setup
    charondebug="ike 1, knl 1, cfg 0"
    uplogtimes=yes

conn %default
    keyexchange=ikev2
    authby=secret
    auto=start
    dpdaction=restart
    dpddelay=30s

conn net-net
    left=172.20.0.10
    leftsubnet=10.0.1.0/24
    leftid=172.20.0.10
    right=172.20.0.20
    rightsubnet=10.0.2.0/24
    rightid=172.20.0.20
    type=tunnel
    ike=aes256-sha256-ecp521!
    esp=aes256-sha256-ecp521!
