# PLAN.md matrix row 12: intentionally weak config #2, critical severity.
# 3DES is RFC 8221 SHOULD NOT (deprecated legacy) and MODP-768 is a known-
# broken DH group (below the 80-bit security floor) -- this should trigger
# the scoring engine's worst-case crypto_strength and key_management scores
# and populate the threat matrix with multiple high-severity findings. This
# is the config to demo the tool catching a genuinely insecure deployment.
# 3DES + SHA-1, MODP-768, PFS off, IKEv1, tunnel mode.
config setup
    charondebug="ike 1, knl 1, cfg 0"
    uplogtimes=yes

conn %default
    keyexchange=ikev1
    authby=secret
    auto=start

conn net-net
    left=172.20.0.10
    leftsubnet=10.0.1.0/24
    leftid=172.20.0.10
    right=172.20.0.20
    rightsubnet=10.0.2.0/24
    rightid=172.20.0.20
    type=tunnel
    ike=3des-sha1-modp768!
    esp=3des-sha1!
    pfs=no
